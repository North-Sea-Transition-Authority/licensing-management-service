# Test-only base configuration (never shipped in the jar).
#
# Phased go-live feature flags: tests exercise the full app with every phase switched on. Defined here (a base,
# non-profile-specific source) rather than in application-<profile>.properties because profile groups must be read
# before profile expansion — a group defined inside a profile-specific document is applied too late to activate.
#
# Live environments activate these incrementally via SPRING_PROFILES_ACTIVE (Initial = neither); local development
# enables them manually in the run configuration.
spring.profiles.group.test=enable-lms1,enable-lms2
spring.profiles.group.integration-test=enable-lms1,enable-lms2
