syntax = "proto3";
import "utils/LineWithId.proto";

package uk.co.fivium.grpc.gis;

option java_multiple_files = true;
option java_outer_classname = "GetLineStartAndEndPointsRequestProto";

message GetLineStartAndEndPointsRequest {
  repeated LineWithId lines = 1;
  bool shouldProjectToWgs84 = 2;
}