name: Update screenshot baselines

on:
  pull_request:
    types: [labeled]

concurrency:
  group: update-screenshots-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update:
    if: |
      github.event.label.name == 'update-gis-screenshots' &&
      github.head_ref != 'develop' &&
      github.head_ref != 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: node:24.16.0

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: gis-framework
        run: npm ci

      - name: Install Chromium
        working-directory: gis-framework
        run: npx playwright install --with-deps chromium

      - name: Update Vitest browser baselines
        working-directory: gis-framework
        run: npm run test:vitest:visual:update
        continue-on-error: true

      - name: Commit updated baselines
        if: always()
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gis-framework/src/test/resources/js/visual-regression-tests/__screenshots__
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
          else
            git commit -m "chore: update screenshot baselines [skip ci]"
            git push
          fi

