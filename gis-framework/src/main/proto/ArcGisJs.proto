syntax = "proto3";

package uk.co.fivium.grpc.gis;

import "enums/LineNavigationType.proto";
import "enums/CoordinateSystem.proto";
import "splitPolygon/SplitPolygonRequest.proto";
import "splitPolygon/SplitPolygonResponse.proto";
import "buildPolygon/BuildPolygonRequest.proto";
import "buildPolygon/BuildPolygonResponse.proto";
import "explodePolygon/ExplodePolygonRequest.proto";
import "explodePolygon/ExplodePolygonResponse.proto";
import "findParentLines/FindParentLinesRequest.proto";
import "findParentLines/FindParentLinesResponse.proto";
import "getLineStartAndEndPoints/GetLineStartAndEndPointsRequest.proto";
import "getLineStartAndEndPoints/GetLineStartAndEndPointsResponse.proto";
import "findNorthwestMostLine/FindNorthwestMostLineRequest.proto";
import "findNorthwestMostLine/FindNorthwestMostLineResponse.proto";
import "validatePolygonReconstructionFromPolylines/ValidatePolygonReconstructionFromPolylinesResponse.proto";
import "validatePolygonReconstructionFromPolylines/ValidatePolygonReconstructionFromPolylinesRequest.proto";
import "migration/blockandsubarea/MigrateBlockOrSubAreaRequest.proto";
import "migration/blockandsubarea/MigrateBlockOrSubAreaResponse.proto";
import "migration/blockandsubarea/BlockAndSubareaValidationRequest.proto";
import "migration/blockandsubarea/ValidationResponse.proto";
import "migration/blockandsubarea/TopologicallyEqualValidationRequest.proto";
import "migration/blockandsubarea/ReferenceBlockValidationRequest.proto";
import "migration/referenceblock/MigrateReferenceBlockRequest.proto";
import "migration/referenceblock/MigrateReferenceBlockResponse.proto";
import "calculateArea/CalculateAreaRequest.proto";
import "calculateArea/CalculateAreaResponse.proto";
import "coordinatesToPolyline/CoordinatesToPolylineRequest.proto";
import "coordinatesToPolyline/CoordinatesToPolylineResponse.proto";

option java_multiple_files = true;
option java_outer_classname = "ArcGisServiceProto";

service ArcGisService {
  rpc splitPolygon (SplitPolygonRequest) returns (SplitPolygonResponse) {};
  rpc buildPolygon (BuildPolygonRequest) returns (BuildPolygonResponse) {};
  rpc explodePolygon (ExplodePolygonRequest) returns (ExplodePolygonResponse) {};
  rpc findParentLines (FindParentLinesRequest) returns (FindParentLinesResponse) {};
  rpc getLineStartAndEndPoints(GetLineStartAndEndPointsRequest) returns (GetLineStartAndEndPointsResponse) {};
  rpc findNorthwestMostLine (FindNorthwestMostLineRequest) returns (FindNorthwestMostLineResponse) {};
  rpc validatePolygonReconstructionFromPolylines (ValidatePolygonReconstructionFromPolylinesRequest) returns (ValidatePolygonReconstructionFromPolylinesResponse) {};
  rpc calculateArea (CalculateAreaRequest) returns (CalculateAreaResponse) {};
  rpc migrateBlockOrSubarea (MigrateBlockOrSubAreaRequest) returns (MigrateBlockOrSubAreaResponse) {};
  rpc validateBlockAndSubarea (BlockAndSubareaValidationRequest) returns (ValidationResponse) {};
  rpc validateTopologicallyEqual (TopologicallyEqualValidationRequest) returns (ValidationResponse) {};
  rpc migrateReferenceBlock (MigrateReferenceBlockRequest) returns (MigrateReferenceBlockResponse) {};
  rpc validateReferenceBlock (ReferenceBlockValidationRequest) returns (ValidationResponse) {};
  rpc coordinatesToPolyline (CoordinatesToPolylineRequest) returns (CoordinatesToPolylineResponse) {};
}
