services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms_app
      POSTGRES_PASSWORD: dev1
    volumes:
      - postgres-data:/var/lib/postgresql/data

  clamav:
    image: clamav/clamav-debian:stable
    ports:
      - "3310:3310"

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    entrypoint: sh
    command:
      -c "mkdir -p /data/lms-bucket && /usr/bin/minio server /data --console-address ':9001'"

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"

volumes:
  postgres-data: