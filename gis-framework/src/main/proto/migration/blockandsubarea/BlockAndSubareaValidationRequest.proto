syntax = "proto3";

package uk.co.fivium.grpc.gis;

import "migration/blockandsubarea/EsriJsonPolygonLineWrappers.proto";
import "enums/CoordinateSystem.proto";

option java_multiple_files = true;
option java_outer_classname = "BlockAndSubareaValidationRequestProto";

message BlockAndSubareaValidationRequest {
    repeated EsriJsonPolygonLineWrappers childPolygonLineWrappersLists = 1;
    repeated EsriJsonPolygonLineWrappers parentPolygonLineWrappersLists = 2;
    CoordinateSystem coordinateSystem = 3;
}