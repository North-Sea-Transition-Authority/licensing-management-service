kind: pipeline
type: docker
name: default

steps:
  # Must run before restore-cache: the fivium-design-system-core/node_modules cache mount is
  # extracted into this directory, and git submodule init refuses to clone into a non-empty one.
  - name: fetch-fds-submodule
    image: alpine/git:v2.26.2
    commands:
      - git config submodule.fivium-design-system-core.url https://github.com/Fivium/fivium-design-system-core.git
      - git submodule update --init --recursive

  - name: restore-cache
    image: drillster/drone-volume-cache
    depends_on: [ fetch-fds-submodule ]
    volumes:
      - name: drone-cache
        path: /cache
    settings:
      restore: true
      mount:
        - ./node_modules
        - ./fivium-design-system-core/node_modules
        # We can only mount volume caches into the working directory, so all steps which use Gradle must have
        # the GRADLE_USER_HOME environment variable pointing here.
        # Split per dind step so concurrent Gradle daemons don't lock each other out
        - ./gradle_cache-gis
        - ./gradle_cache-backend
        - ./gradle_cache-pears
        - ./sonar_cache
        - ./trivy_cache

  - name: detect-gis-changes
    image: alpine/git:v2.26.2
    depends_on: [ restore-cache ]
    commands:
      - git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "^gis-framework/" && touch .gis-framework-changed && echo "GIS changes detected" || echo "No GIS changes detected"

  - name: build-gis-node-backend
    image: node:24.22.1
    depends_on: [ detect-gis-changes ]
    commands:
      - test -f .gis-framework-changed || exit 0
      - cd gis-framework/arcgis-node
      - npm install
      - npm run copy:core
      - npm run proto-gen
      - npm run typecheck
      - npm test

  - name: gis-frontend-visual-tests
    image: node:24.22.1
    depends_on: [ detect-gis-changes ]
    commands:
      - test -f .gis-framework-changed || exit 0
      - cd gis-framework
      - npm ci
      - npx playwright install --with-deps chromium
      - npm run test:vitest:visual

  - name: gis-frontend-visual-tests-publish-report
    image: alpine:3.16.0
    depends_on: [ gis-frontend-visual-tests ]
    when:
      status: [ success, failure ]
    commands:
      - test -f .gis-framework-changed || exit 0
      - mkdir -p build/reports/gis-visual-tests/diffs
      - find gis-framework/.vitest-attachments -name "*.png" -exec cp {} build/reports/gis-visual-tests/diffs/ \; 2>/dev/null || true

  - name: build-gis-java-backend
    image: quay.io/testcontainers/dind-drone-plugin
    privileged: true
    depends_on: [ gis-frontend-visual-tests ]
    environment:
      TZ: Europe/London
      CI_WORKSPACE: /drone/src
      GRADLE_USER_HOME: /drone/src/gradle_cache-gis
      DOCKER_CONFIG_JSON:
        from_secret: docker_config
      DOCKER_CONFIG: /drone/dockerconfig
    volumes:
      - name: docker-cache-overlay2-gis
        path: /drone/docker/overlay2
      - name: docker-cache-image-gis
        path: /drone/docker/image
    settings:
      storage_driver: overlay2 --insecure-registry repo1.dev.fivium.local:5000 --dns=192.168.20.1
      cmd:
        - test -f /drone/src/.gis-framework-changed || exit 0
        - mkdir /drone/dockerconfig
        - echo $DOCKER_CONFIG_JSON > /drone/dockerconfig/config.json
        # Own copy of the project dir so this doesn't race build-backend on gis-framework/build
        - mkdir /drone/src-gis
        - cp -a gis-framework devtools-lms /drone/src-gis/
        - cd /drone/src-gis/gis-framework
        - chmod +x gradlew
        - ./gradlew extractIncludeProto extractProto generateProto
        - ./gradlew test check --parallel --build-cache
      build_image: repo1.dev.fivium.local:5000/docker-compose-java21

  - name: build-frontend
    image: node:24.22.1
    depends_on: [ restore-cache ]
    commands:
      - cd fivium-design-system-core && npm install --no-audit --no-fund --prefer-offline && npx gulp buildAll && cd ..
      - npm install --no-audit --no-fund --prefer-offline && npx gulp buildAll

  - name: build-backend
    image: quay.io/testcontainers/dind-drone-plugin
    privileged: true
    depends_on: [ build-frontend ]
    environment:
      TZ: Europe/London
      CI_WORKSPACE: /drone/src
      GRADLE_USER_HOME: /drone/src/gradle_cache-backend
      DOCKER_CONFIG_JSON:
        from_secret: docker_config
      DOCKER_CONFIG: /drone/dockerconfig
    volumes:
      - name: docker-cache-overlay2-backend
        path: /drone/docker/overlay2
      - name: docker-cache-image-backend
        path: /drone/docker/image
    settings:
      storage_driver: overlay2 --insecure-registry repo1.dev.fivium.local:5000 --dns=192.168.20.1
      cmd:
        - mkdir /drone/dockerconfig
        - echo $DOCKER_CONFIG_JSON > /drone/dockerconfig/config.json
        - chmod +x gradlew
        - ./gradlew checkstyleMain test bootJar --continue --parallel --max-workers=3 --build-cache
      build_image: repo1.dev.fivium.local:5000/docker-compose-java21

  # Compares the licence timeline this application builds with the one PEARS holds. A difference is
  # a discrepancy to investigate rather than a broken build, so the step's failure is ignored -- the
  # report published by sync-reports below is what the step is read for. Runs even when an earlier
  # step failed, so an unrelated test failure does not cost a sweep.
  # Runs on its own dind daemon and Gradle home, so it doesn't queue behind build-backend
  - name: pears-migration-validation
    image: quay.io/testcontainers/dind-drone-plugin
    privileged: true
    failure: ignore
    depends_on: [ restore-cache ]
    environment:
      TZ: Europe/London
      CI_WORKSPACE: /drone/src
      GRADLE_USER_HOME: /drone/src/gradle_cache-pears
      DOCKER_CONFIG_JSON:
        from_secret: docker_config
      DOCKER_CONFIG: /drone/dockerconfig
      PEARS_DATASOURCE_URL: jdbc:oracle:thin:@//db-ogadev1.sb2.dev:1521/ogadev1
      PEARS_DATASOURCE_USERNAME: xviewmgr
      PEARS_DATASOURCE_PASSWORD:
        from_secret: pears_datasource_password
    volumes:
      - name: docker-cache-overlay2-pears
        path: /drone/docker/overlay2
      - name: docker-cache-image-pears
        path: /drone/docker/image
    settings:
      storage_driver: overlay2 --insecure-registry repo1.dev.fivium.local:5000 --dns=192.168.20.1
      cmd:
        - mkdir /drone/dockerconfig
        - echo $DOCKER_CONFIG_JSON > /drone/dockerconfig/config.json
        # Own copy of the project dir so Gradle doesn't lock-contend with build-backend's build
        - mkdir /drone/src-pears
        - tar --exclude=./node_modules --exclude='./gradle_cache-*' --exclude=./sonar_cache --exclude=./trivy_cache --exclude=./.git -C /drone/src -cf - . | tar -xf - -C /drone/src-pears
        - cd /drone/src-pears
        - chmod +x gradlew
        # failure: ignore already covers this step -- sync-reports wants the report copied even on discrepancies
        - ./gradlew pearsMigrationTest || true
        - mkdir -p /drone/src/build/reports
        - cp -a build/reports/. /drone/src/build/reports/
      build_image: repo1.dev.fivium.local:5000/docker-compose-java21
    when:
      status: [ success, failure ]

  - name: sync-reports
    image: alpine:3.16.0
    # pears-migration-validation's own report only lands in build/reports once that step completes
    depends_on: [ build-backend, pears-migration-validation ]
    commands:
      - mkdir -p /var/webfiles/${DRONE_BUILD_NUMBER}
      - cp -r build/reports /var/webfiles/${DRONE_BUILD_NUMBER}
    volumes:
      - name: webfiles
        path: /var/webfiles
    when:
      status: [ success, failure ]

  - name: code-analysis
    image: repo1.dev.fivium.local:5000/sonarcloud-scan-java21:latest
    depends_on: [ build-backend ]
    environment:
      SONAR_TOKEN:
        from_secret: sonarcloud_token
      # Shares build-backend's cache dir since it's serialised after it anyway
      GRADLE_USER_HOME: /drone/src/gradle_cache-backend
      # This SONAR_USER_HOME is the cache path - not the actual user home
      SONAR_USER_HOME: /drone/src/sonar_cache
    commands:
      - chmod +x gradlew
      - ./gradlew sonarqube -info --parallel --build-cache
    when:
      # The Pull Request Pipeline will run the Code Analysis on all other branches (once a PR is open)
      branch:
        - develop
        - main
        - drone/*

  - name: publish-ecr
    image: plugins/ecr:21
    depends_on: [ build-backend ]
    settings:
      repo: digital/licensing-management-service
      registry: 847993322739.dkr.ecr.eu-west-2.amazonaws.com
      access_key: AKIA4K4CXHTZ7KAUZJWL
      secret_key:
        from_secret: ecr_secret_key
      config:
        from_secret: docker_config
      region: eu-west-2
      tags:
        - ${DRONE_BRANCH//\//-}-${DRONE_BUILD_NUMBER}
    when:
      branch:
        - develop
        - main
        - hotfix/**
        - release/**
      status:
        - success

  - name: publish-gis-node-app
    image: plugins/ecr:21
    depends_on: [ build-gis-node-backend ]
    settings:
      repo: digital/licensing-management-service-gis-node-app
      registry: 847993322739.dkr.ecr.eu-west-2.amazonaws.com
      access_key: AKIA4K4CXHTZ7KAUZJWL
      secret_key:
        from_secret: ecr_secret_key
      config:
        from_secret: docker_config
      region: eu-west-2
      tags:
        - ${DRONE_BRANCH//\//-}-${DRONE_BUILD_NUMBER}
      dockerfile: ./gis-framework/arcgis-node/Dockerfile
    when:
      branch:
        - develop
        - main
        - hotfix/**
        - release/**
      status:
        success

  - name: trivy-build-image
    image: docker:20.10.9
    depends_on: [ build-backend ]
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - docker build -t 847993322739.dkr.ecr.eu-west-2.amazonaws.com/digital/licensing-management-service:trivy-scan-target .

  - name: trivy-scan
    failure: ignore
    image: aquasec/trivy:0.58.0
    depends_on: [ trivy-build-image ]
    environment:
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db,aquasec/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
      - name: webfiles
        path: /var/webfiles
    commands:
      # timeout set as initial cache population can seemingly take a while sometimes
      - trivy --cache-dir /drone/src/trivy_cache image --timeout 30m --exit-code 1 847993322739.dkr.ecr.eu-west-2.amazonaws.com/digital/licensing-management-service:trivy-scan-target
    when:
      status:
        - success

  - name: scan-and-sync-public-repo
    image: quay.io/fivium/drone-trufflehog-plugin:v1.0
    depends_on: [ restore-cache ]
    settings:
      scan_since_commit_hash: bf702fbf660fa7d7cb77170d8b2615956b1d2883
      sync_to_mirror: true
      mirror_remote_url: git@github.com:North-Sea-Transition-Authority/licensing-management-service.git
      mirror_branch_to_sync: develop
      mirror_remote_ssh_key:
        from_secret: sync_ssh_key
    when:
      event:
        - push
      branch:
        - develop

  - name: rebuild-cache
    image: drillster/drone-volume-cache
    depends_on: [ sync-reports, code-analysis, publish-ecr, publish-gis-node-app, trivy-scan, scan-and-sync-public-repo ]
    commands:
      # The plugin does not lock, so concurrent rebuilds corrupt each other's rsync into /cache
      - flock -x /cache/.lock -c /usr/local/cacher.sh
    volumes:
      - name: drone-cache
        path: /cache
    settings:
      rebuild: true
      mount:
        - ./node_modules
        - ./fivium-design-system-core/node_modules
        - ./gradle_cache-gis
        - ./gradle_cache-backend
        - ./gradle_cache-pears
        - ./sonar_cache
        - ./trivy_cache

  - name: slack
    image: plugins/slack
    depends_on: [ rebuild-cache ]
    settings:
      webhook:
        from_secret: slack_token
      channel: lms-builds
      template: "*{{build.status}}* <{{build.link}}|Commit {{truncate build.commit 7}} on {{build.branch}} by ${DRONE_COMMIT_AUTHOR_NAME}>\nReports published to: http://drone-assets.fivium.local:9090/licensing-management-service/{{build.number}}/"
    when:
      status: [ success, failure ]
trigger:
  event:
    include:
      - push

volumes:
  - name: webfiles
    host:
      path: /home/fivium/www/licensing-management-service

  - name: drone-cache
    host:
      path: /home/fivium/drone-cache

  - name: docker-sock
    host:
      path: /var/run/docker.sock

  - name: docker-cache-overlay2-gis
    host:
      path: /home/fivium/docker-drone-cache-v2/overlay2-gis

  - name: docker-cache-image-gis
    host:
      path: /home/fivium/docker-drone-cache-v2/image-gis

  - name: docker-cache-overlay2-backend
    host:
      path: /home/fivium/docker-drone-cache-v2/overlay2-backend

  - name: docker-cache-image-backend
    host:
      path: /home/fivium/docker-drone-cache-v2/image-backend

  - name: docker-cache-overlay2-pears
    host:
      path: /home/fivium/docker-drone-cache-v2/overlay2-pears

  - name: docker-cache-image-pears
    host:
      path: /home/fivium/docker-drone-cache-v2/image-pears

---
kind: pipeline
type: docker
name: github-pr

clone:
  disable: true

steps:
  - name: clone
    image: alpine/git:v2.26.2
    commands:
      # Manually cloning as there seems to be a bug with DRONE_BRANCH on Pull Request Events
      # DRONE_BRANCH is set to the target branch, rather than the current branch
      # This means that Sonarcloud doesn't think anything has changed
      - git clone https://github.com/Fivium/licensing-management-service.git .
      - git checkout $DRONE_SOURCE_BRANCH

  # Must run before restore-cache: the fivium-design-system-core/node_modules cache mount is
  # extracted into this directory, and git submodule init refuses to clone into a non-empty one.
  - name: fetch-fds-submodule
    image: alpine/git:v2.26.2
    depends_on: [ clone ]
    commands:
      - git config submodule.fivium-design-system-core.url https://github.com/Fivium/fivium-design-system-core.git
      - git submodule update --init --recursive

  - name: restore-cache
    image: drillster/drone-volume-cache
    depends_on: [ fetch-fds-submodule ]
    volumes:
      - name: drone-cache
        path: /cache
    settings:
      restore: true
      mount:
        - ./node_modules
        - ./fivium-design-system-core/node_modules
        # We can only mount volume caches into the working directory, so all steps which use Gradle must have
        # the GRADLE_USER_HOME environment variable pointing here.
        # Split per dind step so concurrent Gradle daemons don't lock each other out
        - ./gradle_cache-gis
        - ./gradle_cache-backend
        - ./sonar_cache

  - name: detect-gis-changes
    image: alpine/git:v2.26.2
    depends_on: [ restore-cache ]
    commands:
      - git fetch origin $DRONE_TARGET_BRANCH
      - git diff --name-only origin/$DRONE_TARGET_BRANCH...HEAD | grep -q "^gis-framework/" && touch .gis-framework-changed && echo "GIS changes detected" || echo "No GIS changes detected"

  - name: build-gis-node-backend
    image: node:24.22.1
    depends_on: [ detect-gis-changes ]
    commands:
      - test -f .gis-framework-changed || exit 0
      - cd gis-framework/arcgis-node
      - npm install
      - npm run copy:core
      - npm run proto-gen
      - npm run typecheck
      - npm test

  - name: gis-frontend-visual-tests
    image: node:24.22.1
    depends_on: [ detect-gis-changes ]
    commands:
      - test -f .gis-framework-changed || exit 0
      - cd gis-framework
      - npm ci
      - npx playwright install --with-deps chromium
      - npm run test:vitest:visual

  - name: gis-frontend-visual-tests-publish-report
    image: alpine:3.16.0
    depends_on: [ gis-frontend-visual-tests ]
    when:
      status: [ success, failure ]
    commands:
      - test -f .gis-framework-changed || exit 0
      - mkdir -p build/reports/gis-visual-tests/diffs
      - find gis-framework/.vitest-attachments -name "*.png" -exec cp {} build/reports/gis-visual-tests/diffs/ \; 2>/dev/null || true

  - name: build-gis-java-backend
    image: quay.io/testcontainers/dind-drone-plugin
    privileged: true
    depends_on: [ gis-frontend-visual-tests ]
    environment:
      TZ: Europe/London
      CI_WORKSPACE: /drone/src
      GRADLE_USER_HOME: /drone/src/gradle_cache-gis
      DOCKER_CONFIG_JSON:
        from_secret: docker_config
      DOCKER_CONFIG: /drone/dockerconfig
    volumes:
      - name: docker-cache-overlay2-gis
        path: /drone/docker/overlay2
      - name: docker-cache-image-gis
        path: /drone/docker/image
    settings:
      storage_driver: overlay2 --insecure-registry repo1.dev.fivium.local:5000 --dns=192.168.20.1
      cmd:
        - test -f /drone/src/.gis-framework-changed || exit 0
        - mkdir /drone/dockerconfig
        - echo $DOCKER_CONFIG_JSON > /drone/dockerconfig/config.json
        # Own copy of the project dir so this doesn't race build-backend on gis-framework/build
        - mkdir /drone/src-gis
        - cp -a gis-framework devtools-lms /drone/src-gis/
        - cd /drone/src-gis/gis-framework
        - chmod +x gradlew
        - ./gradlew extractIncludeProto extractProto generateProto
        - ./gradlew test check --parallel --build-cache
      build_image: repo1.dev.fivium.local:5000/docker-compose-java21

  # This is in the PR pipeline so the code-analysis below can access the test data (to see coverage)
  - name: build-frontend
    image: node:24.22.1
    depends_on: [ restore-cache ]
    commands:
      - cd fivium-design-system-core && npm install --no-audit --no-fund --prefer-offline && npx gulp buildAll && cd ..
      - npm install --no-audit --no-fund --prefer-offline && npx gulp buildAll

  - name: build-backend
    image: quay.io/testcontainers/dind-drone-plugin
    privileged: true
    # See https://confluence.fivium.co.uk/display/JAVA/Testcontainers
    depends_on: [ build-frontend ]
    environment:
      TZ: Europe/London
      CI_WORKSPACE: /drone/src
      GRADLE_USER_HOME: /drone/src/gradle_cache-backend
      DOCKER_CONFIG_JSON:
        from_secret: docker_config
      DOCKER_CONFIG: /drone/dockerconfig # testcontainers override location for Docker config JSON
    volumes:
      - name: docker-cache-overlay2-backend
        path: /drone/docker/overlay2
      - name: docker-cache-image-backend
        path: /drone/docker/image
    settings:
      storage_driver: overlay2 --insecure-registry repo1.dev.fivium.local:5000 --dns=192.168.20.1
      cmd:
        - mkdir /drone/dockerconfig
        - echo $DOCKER_CONFIG_JSON > /drone/dockerconfig/config.json
        - chmod +x gradlew
        - ./gradlew checkstyleMain test bootJar --continue --parallel --max-workers=3 --build-cache
      build_image: repo1.dev.fivium.local:5000/docker-compose-java21

  # This is in the PR pipeline as only PR events get the necessary information for proper github integration
  - name: code-analysis
    image: repo1.dev.fivium.local:5000/sonarcloud-scan-java21:latest
    depends_on: [ build-backend ]
    environment:
      SONAR_TOKEN:
        from_secret: sonarcloud_token
      # Reuses build-backend's cache dir: this step is serialised after it anyway (via depends_on)
      GRADLE_USER_HOME: /drone/src/gradle_cache-backend
      # This SONAR_USER_HOME is the cache path - not the actual user home
      SONAR_USER_HOME: /drone/src/sonar_cache
    commands:
      - chmod +x gradlew
      - ./gradlew sonarqube -info --parallel --build-cache

  - name: trufflehog-scan
    image: quay.io/fivium/drone-trufflehog-plugin:v1.0
    depends_on: [ code-analysis, gis-frontend-visual-tests-publish-report ]
    settings:
      # The plugin passes this value unquoted to trufflehog, so "--branch HEAD" becomes a flag.
      # Without it, trufflehog scans every branch in the clone, not just this PR.
      scan_since_commit_hash: "${DRONE_TARGET_BRANCH} --branch HEAD"
      sync_to_mirror: false

  - name: rebuild-cache
    image: drillster/drone-volume-cache
    depends_on: [ code-analysis, gis-frontend-visual-tests-publish-report ]
    commands:
      # The plugin does not lock, so concurrent rebuilds corrupt each other's rsync into /cache
      - flock -x /cache/.lock -c /usr/local/cacher.sh
    volumes:
      - name: drone-cache
        path: /cache
    settings:
      rebuild: true
      mount:
        - ./node_modules
        - ./fivium-design-system-core/node_modules
        - ./gradle_cache-gis
        - ./gradle_cache-backend
        - ./sonar_cache

trigger:
  event:
    - pull_request

volumes:
  - name: drone-cache
    host:
      path: /home/fivium/drone-cache

  - name: docker-cache-overlay2-gis
    host:
      path: /home/fivium/docker-drone-cache-v2/overlay2-gis

  - name: docker-cache-image-gis
    host:
      path: /home/fivium/docker-drone-cache-v2/image-gis

  - name: docker-cache-overlay2-backend
    host:
      path: /home/fivium/docker-drone-cache-v2/overlay2-backend

  - name: docker-cache-image-backend
    host:
      path: /home/fivium/docker-drone-cache-v2/image-backend
