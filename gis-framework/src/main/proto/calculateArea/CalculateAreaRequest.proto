syntax = "proto3";
import "calculateArea/PolygonLinesWithNavigationType.proto";
import "enums/CoordinateSystem.proto";

package uk.co.fivium.grpc.gis;

option java_multiple_files = true;
option java_outer_classname = "CalculateAreaRequestProto";

message CalculateAreaRequest {
  reserved 1;
  reserved "linesWithNavigationType";
  CoordinateSystem coordinateSystem = 2;
  repeated PolygonLinesWithNavigationType polygons = 3;
}