buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		// used only by the generateJooq task, to stand up an ephemeral, migrated Postgres for
		// jOOQ codegen to introspect - kept in step with the versions the app itself resolves to
		classpath 'org.testcontainers:testcontainers-postgresql:2.0.5'
		classpath 'org.flywaydb:flyway-database-postgresql:12.4.0'
		classpath 'org.postgresql:postgresql:42.7.11'
	}
}

plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id "org.sonarqube" version "5.1.0.4882"
	id 'checkstyle'
	id 'jacoco'
	id 'nu.studer.jooq' version '9.0'
}

group = 'uk.co.nstauthority'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

def fileUploadLibraryVersion = 'v4.0.0'
def epmqVersion = 'v5.0.0'

// The EPA client's DGS 12 GraphQL client needs com.jayway.jsonpath.spi.json.Jackson3JsonProvider, which only
// exists from json-path 3.0.0. Spring Boot 4.1's BOM still pins 2.10.0, so override it here.
ext['json-path.version'] = '3.0.0'

repositories {
  mavenCentral()
  maven {
    // Required for opensaml deps
    url "https://build.shibboleth.net/nexus/content/repositories/releases/"
  }
  maven { url "https://nexus.fivium.co.uk/repository/maven-releases/" }
  maven { url "https://nexus.fivium.co.uk/repository/maven-snapshots/" }
}

dependencies {
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	implementation 'org.springframework.boot:spring-boot-starter-freemarker'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.jooq:jooq-jpa-extensions'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-security-saml2'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation "org.springframework.data:spring-data-envers"
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'uk.co.fivium.energyportalapi:client:v22.0.0'
	implementation 'uk.co.fivium.energyportal.accounts:energy-portal-accounts-spring-boot-starter:v10.0.0'
	implementation "uk.co.fivium.energyportalmessagequeue:spring-boot-starter:${epmqVersion}"
	implementation "uk.co.fivium.energyportalmessagequeue:messages:${epmqVersion}"
	implementation 'uk.co.fivium.feedbackmanagementservice:client:v3.0.0'
	implementation 'uk.co.fivium.digitalformlibrary:digital-form-library:v5.0.0'
	implementation "uk.co.fivium:digital-document-library-spring-boot-starter:v4.0.0"
	implementation 'uk.co.fivium:digital-enum-materialisation-library-spring-boot-starter:v2.0.0'
	implementation 'uk.co.fivium:digital-notification-library-spring-boot-starter:v2.0.0'
// TODO re-add when payments required
//	implementation 'uk.co.fivium:digital-payments-library-spring-boot-starter:1.0.0'
	implementation "uk.co.fivium:file-upload-spring-boot-starter:${fileUploadLibraryVersion}"
	implementation 'uk.co.fivium:ftss-client-spring-boot-starter:v2.0.0'
	implementation project(":gis-framework")
	// Reads the PEARS licence operation history, which arrives as one XML document per licence.
	// Kept off the HTTP message converters by WebMvcConfiguration.extendMessageConverters.
	implementation 'tools.jackson.dataformat:jackson-dataformat-xml'
	implementation 'org.apache.commons:commons-collections4:4.4'
	implementation 'org.apache.commons:commons-lang3:3.18.0'
	implementation 'org.apache.commons:commons-text:1.13.0'
	implementation 'commons-validator:commons-validator:1.10.1'
	implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
	implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.3.0'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11'

	jooqGenerator 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testRuntimeOnly 'org.springframework.boot:spring-boot-restclient'
	testImplementation "uk.co.fivium:file-upload-spring-boot-starter-test:${fileUploadLibraryVersion}"
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	testImplementation "org.testcontainers:testcontainers"
	testImplementation "org.testcontainers:testcontainers-postgresql"
}

def jooqGeneratedSourcesDir = "${buildDir}/generated-src/jooq/main"

sourceSets {
	main {
		java {
			srcDirs += jooqGeneratedSourcesDir
		}
	}
}

// generateJooq migrates a throwaway Testcontainers Postgres with the project's Flyway migrations and generates
// typed table/record classes from it. While the migrations are unchanged it is up to date or comes from the build
// cache, so Docker is only needed when they change. The generated sources live under build/ and are gitignored.
def jooqCodegenContainer = null

tasks.register('stopJooqCodegenDatabase') {
	doLast {
		jooqCodegenContainer?.stop()
	}
}

jooq {
	version = '3.21.9'
	edition = nu.studer.gradle.jooq.JooqEdition.OSS

	configurations {
		main {
			generateSchemaSourceOnCompilation = false

			generationTool {
				jdbc {
					driver = 'org.postgresql.Driver'
					// overwritten at execution time (see generateJooq.doFirst below) with the
					// ephemeral container's connection details
					url = ''
					user = ''
					password = ''
				}

				generator {
					name = 'org.jooq.codegen.DefaultGenerator'
					database {
						name = 'org.jooq.meta.postgres.PostgresDatabase'
						inputSchema = 'lms'
						// widen this as more tables need typed jOOQ access - keeping it scoped avoids
						// committing a typed class for every table in the shared "lms" schema
						includes = 'licence_event_cache|licences'
						excludes = ''
					}
					generate {
						javaTimeTypes = true
					}
					target {
						packageName = 'uk.co.nstauthority.licensingmanagementservice.jooq'
						directory = jooqGeneratedSourcesDir
					}
				}
			}
		}
	}
}

tasks.named('generateJooq') {
	// The migrations are the only input the plugin doesn't already track. Declaring them lets the task be cached.
	inputs.dir('src/main/resources/db/migration')
		.withPropertyName('migrations')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	allInputsDeclared = true
	finalizedBy 'stopJooqCodegenDatabase'

	// Started here rather than in its own task, so it only runs when generation does
	doFirst {
		def container = new org.testcontainers.postgresql.PostgreSQLContainer(
			org.testcontainers.utility.DockerImageName.parse('postgres:16-alpine')
		)
		container.start()
		jooqCodegenContainer = container

		// Set after the inputs are fingerprinted, so they don't change the cache key
		def jdbc = jooq.configurations.getByName('main').jooqConfiguration.jdbc
		jdbc.url = container.getJdbcUrl()
		jdbc.user = container.getUsername()
		jdbc.password = container.getPassword()

		org.flywaydb.core.Flyway.configure()
			.dataSource(container.getJdbcUrl(), container.getUsername(), container.getPassword())
			.schemas('lms')
			.locations('filesystem:src/main/resources/db/migration')
			.placeholders([
				'application-schema'         : 'lms',
				'datawarehouse-user-password': 'codegen',
			])
			.load()
			.migrate()
	}
}

tasks.named('compileJava') {
	dependsOn 'generateJooq'
}

tasks {
	test {
		useJUnitPlatform {
			excludeTags 'pears-migration'
		}
		finalizedBy jacocoTestReport
		systemProperty 'spring.profiles.active', 'test'
		maxParallelForks 4
    maxHeapSize = '2g'
	}
	bootJar {
		archiveFileName.set("${rootProject.name}.jar")
		exclude('**/localdevonly/**')
	}
	checkstyleMain {
		// generated jOOQ sources don't follow the project's style conventions and aren't hand-maintained
		exclude '**/jooq/**'
	}
}

// Not wired into 'check' or 'build': this sweeps every licence PEARS holds over a live Oracle
// connection, and its failures are discrepancies to investigate rather than a broken build.
tasks.register('pearsMigrationTest', Test) {
	group = 'verification'
	description = 'Compares the licence timeline this application builds with the one PEARS holds.'
	useJUnitPlatform {
		includeTags 'pears-migration'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	// One Oracle pool, one database container, one report.
	maxParallelForks = 1
	// Licences are swept on several threads within that fork. Each holds a connection from both Hikari
	// pools, which default to 10, so raise those if going above that.
	systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
	systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
	systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism',
		providers.gradleProperty('pearsMigrationParallelism').getOrElse('4')
	shouldRunAfter tasks.named('test')
	testLogging {
		showStandardStreams = true
	}
}

sonarqube {
	properties {
		property 'sonar.exclusions', '**/nstauthority/licensingmanagementservice/mockups/**'
		property 'sonar.projectKey', "Fivium_${rootProject.name}"
		property 'sonar.organization', 'fivium-gh'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.login', System.getenv('SONARCLOUD_TOKEN')

		if (System.getenv('DRONE_PULL_REQUEST') != null) {
			property 'sonar.pullrequest.key', System.getenv('DRONE_PULL_REQUEST')
			property 'sonar.pullrequest.base', System.getenv('DRONE_TARGET_BRANCH')
			property 'sonar.pullrequest.branch', System.getenv('DRONE_SOURCE_BRANCH')
			property 'sonar.pullrequest.provider', 'github'
			property 'sonar.pullrequest.github.repository', "${rootProject.name}"
			property 'sonar.pullrequest.github.endpoint', 'https://api.github.com/'
		} else {
			property 'sonar.branch.name', System.getenv('DRONE_BRANCH')
			if (System.getenv('DRONE_BRANCH') != 'develop') {
				property 'sonar.branch.target', 'develop'
			}
			property 'sonar.coverage.jacoco.xmlReportPaths',
					"${layout.buildDirectory}/reports/jacoco/test/jacocoTestReport.xml," +
							"${project(':gis-framework').layout.buildDirectory}/reports/jacoco/test/jacocoTestReport.xml"

		}
	}
}

project(":gis-framework") {
	sonarqube {
		properties {
			property 'sonar.javascript.lcov.reportPaths', 'arcgis-node/coverage/lcov.info'
			property 'sonar.sources',
					sourceSets.main.java.srcDirs.findAll { it.exists() }.collect { it.path }.join(',') +
							',arcgis-node/src'
			property 'sonar.tests',
					sourceSets.test.java.srcDirs.findAll { it.exists() }.collect { it.path }.join(',') +
							',arcgis-node/tests'
		}
	}
}

checkstyle {
	config = rootProject.resources.text.fromFile('devtools-lms/checkstyle.xml')
	toolVersion '10.26.0'
	ignoreFailures = false
	maxWarnings = 0
}

jacocoTestReport {
	reports {
		xml.required = true
	}
}