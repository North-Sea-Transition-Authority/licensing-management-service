version: '3.9'

services:

  local-db:
    image: postgres:16-alpine
    ports:
      - target: 5432
        published: 5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dev1
      POSTGRES_DB: lms
    volumes:
      - lms-db-volume:/var/lib/postgresql/data
      - ./create_db_user.sh:/docker-entrypoint-initdb.d/create_db_user.sh

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    entrypoint: sh
    command:
      -c "mkdir -p /data/lms-bucket && /usr/bin/minio server /data --console-address ':9001'"

volumes:
  lms-db-volume: