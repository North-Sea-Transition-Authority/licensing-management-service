database.url=jdbc:postgresql://${XYZ_DATABASE_URL}
schema.password=${XYZ_DATABASE_PASSWORD}

saml.entity-id=${XYZ_SAML_ENTITY_ID}
saml.login-url=${XYZ_SAML_LOGIN_URL}
saml.consumer-service-location=${XYZ_SAML_BASE_URL}${server.servlet.context-path}/login/saml2/sso/saml
saml.certificate=${XYZ_SAML_CERTIFICATE}

energy-portal.logout-url=${XYZ_ENERGY_PORTAL_LOGOUT_URL}
energy-portal.logout-pre-shared-key=${XYZ_ENERGY_PORTAL_LOGOUT_KEY}
energy-portal.registration-url=${XYZ_ENERGY_PORTAL_REGISTRATION_URL}

energy-portal-api.url=${XYZ_ENERGY_PORTAL_URL}
energy-portal-api.preSharedKey=${XYZ_ENERGY_PORTAL_KEY}

file-upload.s3.access-key=${XYZ_S3_ACCESS_TOKEN}
file-upload.s3.secret-token=${XYZ_S3_SECRET_TOKEN}
file-upload.s3.default-bucket=${XYZ_S3_DEFAULT_BUCKET}
file-upload.s3.endpoint=${XYZ_S3_ENDPOINT:s3.eu-west-2.amazonaws.com}
file-upload.s3.signing-region=${XYZ_S3_SIGNING_REGION:eu-west-2}
file-upload.s3.proxy.host=${XYZ_S3_PROXY_HOST}
file-upload.s3.proxy.port=${XYZ_S3_PROXY_PORT}
file-upload.clamav.host=${XYZ_CLAMAV_HOST}
file-upload.clamav.port=${XYZ_CLAMAV_PORT}
file-upload.clamav.timeout=PT1M

#energy portal access
energy-portal.access-api.base-url=${XYZ_ENERGY_PORTAL_TEAM_ACCESS_API_BASE_URL:}
energy-portal.access-api.token=${XYZ_ENERGY_PORTAL_TEAM_ACCESS_API_TOKEN:}

