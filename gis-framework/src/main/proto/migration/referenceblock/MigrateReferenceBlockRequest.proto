syntax = "proto3";

package uk.co.fivium.grpc.gis;

import "migration/EsriJsonLineWithNavigationAndId.proto";
import "enums/CoordinateSystem.proto";
import "migration/GeoJsonLineWrapper.proto";

option java_multiple_files = true;
option java_outer_classname = "MigrateReferenceBlockRequestProto";

message MigrateReferenceBlockRequest {
  repeated GeoJsonLineWrapper geoJsonLineWrappers = 1;
  CoordinateSystem coordinateSystem = 2;
  repeated EsriJsonLineWithNavigationAndId licenseBlockLines = 3;
}

