syntax = "proto3";

package uk.co.fivium.grpc.gis;

import "migration/blockandsubarea/EsriJsonPolygonLines.proto";
import "enums/CoordinateSystem.proto";

option java_multiple_files = true;
option java_outer_classname = "TopologicallyEqualValidationRequestProto";

message TopologicallyEqualValidationRequest {
  repeated EsriJsonPolygonLines childPolygons = 1;
  repeated EsriJsonPolygonLines parentPolygons = 2;
  CoordinateSystem coordinateSystem = 3;
}