syntax = "proto3";

package arcgisjs;

import "enums/LineNavigationType.proto";
import "enums/CoordinateSystem.proto";

option java_multiple_files = true;
option java_package = "uk.co.fivium.grpc";
option java_outer_classname = "ArcGisServiceProto";

service ArcGisService {
  rpc testFunction (TestFunctionMessage) returns (TestFunctionMessage) {};
}

message TestFunctionMessage {
  string testStr = 1;
  int32 wkid = 2;
}
