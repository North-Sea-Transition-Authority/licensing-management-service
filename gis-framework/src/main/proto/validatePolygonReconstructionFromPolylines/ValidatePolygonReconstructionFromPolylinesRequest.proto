syntax = "proto3";

package uk.co.fivium.grpc.gis;

option java_multiple_files = true;
option java_outer_classname = "ValidatePolygonReconstructionFromPolylinesRequestProto";

message ValidatePolygonReconstructionFromPolylinesRequest {
  repeated string esriJsonPolylines = 1;
  string originalPolygonEsriJson = 2;
}